name: Build K90PM Tuner APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        # 原 android-actions/setup-android@v3 在新 runner 上会尝试安装已废弃的 'tools' 包，
        # 导致 sdkmanager 报错退出（Failed to find package 'tools'）。runner 已预装 platform/build-tools，
        # 这里只需接受 license 即可，不再额外装任何包。
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK_ROOT=$SDK_ROOT"
          for CT in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$CT" ]; then
              echo "accepting licenses via $CT"
              yes | "$CT" --licenses >/dev/null 2>&1 || true
            fi
          done
          echo "SDK ready"

      - name: Restore signing keystore from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > debug.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          validate-wrappers: false

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K90PM_Tuner-APK
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0